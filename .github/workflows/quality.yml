name: Quality checks

on:
  pull_request:
  push:
    branches:
      - main
      - 'seo/**'

permissions:
  contents: read

jobs:
  test:
    name: Application and technical SEO tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run syntax and regression checks
        run: npm run check
